[package]
name = "tpt-infer-quantize"
description = "INT8/INT4 quantization and dequantization kernels for edge deployment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["tpt-infer-core/alloc", "tpt-infer-graph/std", "tpt-infer-ops/std"]

[dependencies]
tpt-infer-core = { workspace = true }
tpt-infer-graph = { workspace = true, default-features = false }
tpt-infer-ops = { workspace = true, default-features = false }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "quant_matmul"
harness = false

[package.metadata.docs.rs]
all-features = true
