[package]
name = "tpt-infer-compile"
description = "Ahead-of-time compiler that translates computation graphs into optimized Rust code"
keywords = ["codegen", "compiler", "inference", "aot", "ml"]
categories = ["science", "compilers", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["tpt-infer-core/alloc", "tpt-infer-graph/std"]

[dependencies]
tpt-infer-core = { workspace = true }
tpt-infer-graph = { workspace = true, default-features = false }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
tpt-infer-ops = { workspace = true }
tpt-infer-runtime = { workspace = true, features = ["std"] }
# Dev-only: lets the real-model regression test load the cached real ONNX
# fixture (see crates/tpt-infer-onnx/tests/fixtures/real/). tpt-infer-onnx
# does not depend on tpt-infer-compile, so this does not create a cycle
# (same pattern as tpt-infer-runtime's dev-dependency on it).
tpt-infer-onnx = { workspace = true, default-features = false, features = ["std"] }

[[bench]]
name = "codegen_vs_interpreted"
harness = false

[package.metadata.docs.rs]
all-features = true
