[package]
name = "tpt-infer-vision"
description = "Pure-Rust image preprocessing (resize, normalize, letterbox) for vision models"
keywords = ["image", "preprocessing", "inference", "vision", "ml"]
categories = ["multimedia::images", "multimedia", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["tpt-infer-core/alloc", "dep:image"]

[dependencies]
tpt-infer-core = { workspace = true, features = ["alloc"] }
image = { workspace = true, optional = true }

[dev-dependencies]
tpt-infer-ops = { workspace = true }

[package.metadata.docs.rs]
all-features = true
