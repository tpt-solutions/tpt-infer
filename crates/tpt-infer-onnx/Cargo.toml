[package]
name = "tpt-infer-onnx"
description = "Pure-Rust ONNX model parser and operator registry (no C-FFI)"
keywords = ["onnx", "parser", "inference", "ml", "protobuf"]
categories = ["science", "parsing", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
std = ["tpt-infer-core/alloc", "tpt-infer-graph/std"]

[dependencies]
tpt-infer-core = { workspace = true }
# The loader is inherently `std` (file IO + `prost`), so graph's `std` feature is
# enabled unconditionally; our own `std` feature additionally gates
# `tpt-infer-core/alloc` (and idempotently `tpt-infer-graph/std`).
tpt-infer-graph = { workspace = true, default-features = false, features = ["std"] }
prost = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Used only by the opt-in real-model fixture test (see
# tests/real_model_fixtures.rs); never a production dependency.
ureq = { workspace = true }
sha2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
