[package]
name = "tpt-infer-runtime"
description = "Zero-allocation bare-metal inference execution engine"
keywords = ["inference", "no-std", "embedded", "ml", "runtime"]
categories = ["no-std", "embedded", "science", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
alloc = ["tpt-infer-core/alloc"]
std = ["alloc", "tpt-infer-graph/std", "tpt-infer-ops/std"]

[dependencies]
tpt-infer-core = { workspace = true }
tpt-infer-graph = { workspace = true, default-features = false }
tpt-infer-ops = { workspace = true, default-features = false }
# NOTE: `tpt-infer-compile` is intentionally not a dependency: it AOT-compiles
# a graph into standalone Rust source (to be built separately via `rustc`),
# not an IR this crate can interpret. The runtime therefore executes
# `ComputationGraph` IR directly (see `execute`/`execute_graph`).

[dev-dependencies]
# Feature unification during `cargo test`: dev-dependency features merge with
# normal-dependency features for the same crate, so plain `cargo test -p
# tpt-infer-runtime` compiles the `std`-gated execution API and `TensorVec`
# without needing `--features std`.
tpt-infer-core = { workspace = true, features = ["alloc"] }
tpt-infer-graph = { workspace = true, features = ["std"] }
criterion = { workspace = true }
# Dev-only: lets the `onnx_end_to_end` integration test load a real `.onnx`
# fixture file (see crates/tpt-infer-onnx/tests/fixtures/) and run it
# through `execute`/`execute_graph`. `tpt-infer-onnx` does not depend on
# `tpt-infer-runtime`, so this does not create a dependency cycle (same
# pattern already used for `tpt-infer-compile`'s dev-deps on this crate).
tpt-infer-onnx = { workspace = true, default-features = false, features = ["std"] }

[[bench]]
name = "latency"
harness = false
required-features = ["std"]

[[test]]
name = "onnx_mobilenet_end_to_end"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
