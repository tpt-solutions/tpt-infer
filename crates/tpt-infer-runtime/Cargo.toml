[package]
name = "tpt-infer-runtime"
description = "Zero-allocation bare-metal inference execution engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
alloc = ["tpt-infer-core/alloc"]
std = ["alloc", "tpt-infer-graph/std", "tpt-infer-ops/std"]

[dependencies]
tpt-infer-core = { workspace = true }
tpt-infer-graph = { workspace = true, default-features = false }
tpt-infer-ops = { workspace = true, default-features = false }
tpt-infer-compile = { workspace = true, default-features = false }

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
