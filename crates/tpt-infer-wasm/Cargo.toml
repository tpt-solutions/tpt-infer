[package]
name = "tpt-infer-wasm"
description = "WASM/JS bindings for tpt-infer: load and run ONNX models in the browser or Node.js"
keywords = ["wasm", "onnx", "inference", "ml", "browser"]
categories = ["wasm", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
tpt-infer-core = { workspace = true, features = ["alloc"] }
tpt-infer-graph = { workspace = true, features = ["std"] }
tpt-infer-onnx = { workspace = true, default-features = false, features = ["std"] }
tpt-infer-ops = { workspace = true, default-features = false, features = ["std"] }
tpt-infer-runtime = { workspace = true, default-features = false, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
